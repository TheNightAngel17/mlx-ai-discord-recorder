# config.docker.yaml — Docker/Compose overlay of config.yaml.
#
# docker-compose bind-mounts this file over /app/config.yaml in every service.
# It is a COMPLETE config (it fully replaces config.yaml in the containers); only
# the deployment-specific values differ from the repo-root config.yaml:
#   - data paths point at the shared volumes (/data/...)
#   - service URLs use Compose service names instead of localhost
# Secrets (DISCORD_TOKEN, GUILD_ID, *_API_KEY) come from .env via env_file.
#
# Keep the non-deployment settings (providers, models, tuning) in sync with
# config.yaml, or edit them here for the containerized stack specifically.

# --- Shared data volumes (mounted at identical paths in every container) ---
output_directory: /data/recordings
vector_db_directory: /data/vectordb

# --- ChromaDB server (dedicated container that owns the HNSW vector index) ---
# py-process and py-query use HttpClient to talk to this service rather than
# opening PersistentClient directly, which avoids the stale-HNSW bug when
# multiple containers share the same on-disk data volume.
chroma_server_host: chromadb
chroma_server_port: 8000
# Session categories store — bind-mounted from ./categories at /app/categories in every
# service (rw for the bot so /mlx-ai category writes persist back to the host).
categories_directory: /app/categories

# --- Recording / announcements ---
announce_channel: "bot-commands"
mp3_bitrate: "128k"
keep_wav: true
keep_mix_mp3: false     # export the combined _session_mix.mp3 (false = skip the combined audio file)
keep_mix_wav: false     # also keep the uncompressed _session_mix.wav alongside the MP3
# Do-not-record: skip certain speakers entirely (no WAVs, no transcription).
ignore_bots: true       # skip every Discord bot (e.g. music bots)
do_not_record: []       # additionally skip specific users by ID (preferred) or username
snippet_silence_ms: 1000
snippet_tail_pad_ms: 200
snippet_max_ms: 30000   # safety cap on a single utterance's in-memory PCM buffer (0 = off)

# --- Whisper defaults (batch fallback / shared language) ---
whisper_model: "base"
whisper_language: "en"

# --- Live transcription service (py-transcribe) ---
auto_transcribe: true
transcribe_api_host: 0.0.0.0
transcribe_api_port: 8200
transcribe_provider: faster-whisper
transcribe_model: distil-large-v3
transcribe_device: cuda
transcribe_compute_type: float16
transcribe_min_ms: 400
# Noise / hallucination pruning (faster-whisper only) — see config.yaml for details.
transcribe_vad_filter: true
transcribe_vad_min_silence_ms: 500
transcribe_condition_on_previous_text: false
transcribe_no_speech_threshold: 0.6
transcribe_log_prob_threshold: -1.0
transcribe_compression_ratio_threshold: 2.4
transcribe_hallucination_silence_threshold: 2.0
transcribe_max_no_speech_prob: 0.8
prune_empty_snippets: true   # delete WAV+sidecar when a snippet transcribes to no speech
delete_wav_after_transcribe: true   # delete each snippet WAV once its transcript sidecar is written (no mix kept; precludes re-transcribe)
transcribe_api_url: http://py-transcribe:8200

# --- Post-processing job service (py-process) ---
process_api_host: 0.0.0.0
process_api_port: 8300
process_api_url: http://py-process:8300

# --- Vectorization / RAG ---
chunk_minutes: 3

# Embedding provider (must match what indexed the sessions)
embedding_provider: voyage
embedding_model: voyage-3-large

# Chat provider
chat_provider: anthropic
chat_model: claude-sonnet-5

# Ollama (used only when a provider above is set to "ollama"). Points at the
# optional `ollama` Compose service (enable with `--profile ollama`).
ollama_base_url: http://ollama:11434

# --- RAG query API (py-query) ---
query_api_host: 0.0.0.0
query_api_port: 8100
query_api_url: http://py-query:8100

# --- Session summaries ---
auto_summarize: true
summary_max_tokens: 8192
summary_max_input_tokens: 750000
