# config.yaml — User-editable, non-secret settings for the MLX AI Discord Recorder.
# Secrets (DISCORD_TOKEN, GUILD_ID, HF_TOKEN) go in .env — never in this file.

# Directory where session folders and audio files are written.
# Supports both relative (from the bot's working directory) and absolute paths.
output_directory: ./recordings

# Name of the text channel the bot uses for recording announcements.
# The channel must already exist in your server.
# Examples: "bot-commands", "general", "dnd-bot"
announce_channel: "bot-commands"

# HuggingFace token for speaker diarization via pyannote.audio.
# Get your token at https://huggingface.co/settings/tokens
# You must also accept the pyannote model licence at:
#   https://huggingface.co/pyannote/speaker-diarization-3.1
# Alternatively set HF_TOKEN in your .env file — that takes precedence.
huggingface_token: ""

# Whisper model size used for transcription.
# Smaller models are faster; larger models are more accurate.
# Options: tiny, base, small, medium, large, large-v2, large-v3
whisper_model: "base"
