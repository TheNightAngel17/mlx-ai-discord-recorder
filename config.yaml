# config.yaml — User-editable, non-secret settings for the MLX AI Discord Recorder.
# Secrets (DISCORD_TOKEN, GUILD_ID) go in .env — never in this file.

# Directory where session folders and audio files are written.
# Supports both relative (from the bot's working directory) and absolute paths.
output_directory: D:/mlx-ai-recordings

# Name of the text channel the bot uses for recording announcements.
# The channel must already exist in your server.
# Examples: "bot-commands", "general", "dnd-bot"
announce_channel: "bot-commands"

# Audio merge and compression settings
mp3_bitrate: "128k"     # MP3 bitrate for compression (e.g. "64k", "128k", "192k", "320k")
keep_wav: true           # Keep the per-user snippet WAVs after the session mix is exported.
                         # Set false to delete snippets (and their sub-folders) once merge_audio.py finishes.

# Recording / snippet settings
# Each participant's speech is captured as discrete utterance snippets in a
# per-user sub-folder: <session>/<username>/<offset_ms>.wav
#
# snippet_silence_ms: how long a user must be continuously silent before the
#   current utterance snippet is closed. This window also acts as a "back-pad" —
#   the stream stays open until the speaker is genuinely silent this long, so
#   trailing words (which Discord can signal as "stopped" a touch early) are
#   still captured. Tuning trade-off:
#     too low  (e.g. 300)  -> sentences fragment across files; Whisper loses context
#     too high (e.g. 3000) -> separate utterances merge into one long snippet
snippet_silence_ms: 1000
# snippet_tail_pad_ms: extra trailing silence appended to each snippet so Whisper
#   has a short lead-out and doesn't clip the final word. Set 0 to disable.
snippet_tail_pad_ms: 200

# Whisper transcription defaults.
# These are used when the /mlx-ai transcribe start command is run
# without specifying --model or --language.
# Model options: tiny, base, small, medium, large
whisper_model: "base"
# Language code (e.g. "en", "es", "fr"). Set to "auto" for auto-detection.
whisper_language: "en"

# ====================================================
# Live transcription service (py-transcribe/app.py)
# ====================================================
# When auto_transcribe is on, the recorder POSTs each finished utterance snippet
# to a warm-model Whisper service that transcribes it immediately, writing a
# <offset_ms>.json sidecar next to the WAV. At post-process time transcribe.py
# assembles the combined transcript from those sidecars (no model reload), so
# most transcription work happens *during* the session instead of after it.
#
# Start the service with:
#   cd py-transcribe && uvicorn app:app --host 0.0.0.0 --port 8200
#
# If the service is down (or auto_transcribe is false), the system falls back to
# batch transcription in transcribe.py — nothing breaks, it's just slower.
auto_transcribe: true
transcribe_api_host: 0.0.0.0
transcribe_api_port: 8200
# Backend: faster-whisper (CTranslate2, ~4x faster, lower memory; recommended on
# GPU) or openai-whisper (PyTorch reference, matches the batch pipeline output).
transcribe_provider: faster-whisper
# Model size. If unset, falls back to whisper_model above.
transcribe_model: base
# Device: cuda | cpu | auto
transcribe_device: cuda
# faster-whisper compute type: float16 (GPU) or int8 (CPU). Ignored by openai-whisper.
transcribe_compute_type: float16
# Snippets shorter than this many ms are treated as non-speech blips and skipped
# (both live and in the batch fallback).
transcribe_min_ms: 400
# URL the bot and process.py use to REACH this service. Use localhost for
# bare-metal; in Docker set it to the service name (e.g. http://py-transcribe:8200).
transcribe_api_url: http://localhost:8200

# ====================================================
# Post-processing job service (py-process/app.py)
# ====================================================
# Runs transcribe -> merge -> vectorize -> summarize as background jobs that the
# bot triggers over HTTP (instead of spawning Python directly). Start with:
#   cd py-process && uvicorn app:app --host 0.0.0.0 --port 8300
process_api_host: 0.0.0.0
process_api_port: 8300
# URL the bot uses to reach this service (the service name in Docker).
process_api_url: http://localhost:8300

# Vector DB and RAG settings
# Update these paths to match your OS (Windows: D:/path, Linux/macOS: /path or ./relative)
vector_db_directory: D:/mlx-ai-vectordb   # Where ChromaDB persists data
chunk_minutes: 3                           # Time-window size for chunking transcripts (minutes)

# Session categories
# Each category is a session "style" (D&D, work meeting, event planning, …) defined by a
# pair of files in this directory: <category_name>.json (display_name + collection_name) and
# <category_name>.md (the summary prompt). Manage them with /mlx-ai category add|edit|delete|list.
# A relative path is resolved against the directory containing this config.yaml (the repo root).
# The built-in "dnd" category reproduces the original D&D behaviour (collection: dnd_sessions).
categories_directory: ./categories

# LLM Provider settings
# Supported embedding providers: ollama | openai | voyage
# Supported chat providers:      ollama | openai | anthropic
# NOTE: Anthropic does NOT offer an embedding API — use ollama, openai, or voyage for embeddings.
#


# ====================================================
# Vectorization (embedding) Provider Settings
# =====================================================

# WARNING: embedding_provider and embedding_model must match what was used when
# vectorize.py indexed the sessions. Changing them requires re-running:
#   python py-process/vectorize.py --all --force --reset-collection  
# This will fully reset the DB collection, and then re-process and re-index all sessions with the new provider/model settings.

# OLLAMA SETTINGS
# embedding_provider: ollama 
# embedding_model: nomic-embed-text 

# OPENAI SETTINGS
# embedding_provider: openai
# embedding_model: text-embedding-3-small

# VOYAGE AI SETTINGS
embedding_provider: voyage
embedding_model: voyage-3-large   # Options: voyage-3-large, voyage-3, voyage-3-lite





# ====================================================
# Chat Provider Settings
# =====================================================

# OLLAMA SETTINGS
# chat_provider: ollama
# chat_model: llama3.2

# ANTHROPIC SETTINGS
chat_provider: anthropic
chat_model: claude-sonnet-4-6

# OPENAI SETTINGS
# chat_provider: openai
# chat_model: gpt-4.1

# Ollama settings (used when provider is "ollama")
ollama_base_url: http://localhost:11434    # Ollama API base URL

# RAG Query API settings (py-query/app.py)
# Start the API with: uvicorn app:app --host 0.0.0.0 --port 8100
query_api_host: 0.0.0.0    # Host the API server binds to (0.0.0.0 = all interfaces)
query_api_port: 8100        # Port the API server listens on
# URL the bot uses to REACH this service. localhost for bare-metal; in Docker set
# it to the service name (e.g. http://py-query:8100).
query_api_url: http://localhost:8100
# API keys for cloud providers go in .env — never in this file:
#   OPENAI_API_KEY=sk-...
#   ANTHROPIC_API_KEY=sk-ant-...
#   VOYAGE_API_KEY=pa-...

# Session summary settings
# auto_summarize: when true, process.py automatically runs summarize.py after vectorization.
#   Set to false to skip automatic summarization (you can still run summarize.py manually).
auto_summarize: true
# summary_max_tokens: approximate token budget for the LLM when generating session summaries.
#   Controls how long the summary output is. Larger values produce more detailed summaries
#   but require more context window capacity from the chat model.
summary_max_tokens: 2000
# summary_max_input_tokens: maximum input tokens per summarization chunk.
#   Transcripts longer than (summary_max_input_tokens × 4) characters are automatically
#   split and processed with map-reduce summarization.
#   Adjust based on your LLM provider's context window:
#
#   Provider/Model                  | Context Window | Recommended setting
#   --------------------------------|----------------|--------------------
#   OpenAI GPT-4o / GPT-4o-mini    | 128K tokens    | 100000
#   Anthropic Claude 3.5 Sonnet     | 200K tokens    | 150000
#   Anthropic Claude 3 Opus         | 200K tokens    | 150000
#   Ollama Llama 3.1 8B/70B         | 128K tokens    | 32000 (set PARAMETER num_ctx 32000 in Modelfile)
#   Ollama Llama 3 8B               |   8K tokens    | 6000  (set PARAMETER num_ctx 6000 in Modelfile)
#   Ollama Mixtral 8x7B             |  32K tokens    | 24000
#   Ollama Mistral 7B               |   8K tokens    | 6000  (set PARAMETER num_ctx 6000 in Modelfile)
#   Ollama Qwen2.5 7B/14B           | 128K tokens    | 32000
#
#   Rule of thumb: ~75% of your model's context window. 1 token ≈ 4 characters.
summary_max_input_tokens: 32000
